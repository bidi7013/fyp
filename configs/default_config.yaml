# ASPIRE-Vision default run configuration
# CAT405 Intelligent Computing Major Project
#
# A full copy of the effective configuration is stored in every run's manifest.json.
# Counting lines are defined per video in configs/lines/<split>__<video>.json.

detector:
  model_weights: "yolov8n.pt"   # one pretrained COCO detector for the MVP
  confidence_threshold: 0.1     # low so the tracker's second association can use weak boxes
  iou_threshold: 0.5
  classes: [0]                  # 0 = person
  image_size: 640
  device: null                  # null = let Ultralytics choose (CUDA if available)

tracker:
  tracker_type: "bytetrack"     # 'bytetrack' or 'botsort' -> configs/trackers/<type>.yaml

counting:
  anchor_point: "bottom_center" # ground-contact point of the box
  hysteresis_buffer_pixels: 10  # deadband either side of the line; crossing confirmed on clearing it
  min_frames_between_events: 15 # per-track cooldown between two events on the same line
  forget_track_after_frames: 60 # drop line state for tracks unseen this long (2 x track_buffer)

output:
  write_review_video: true      # browser-playable VP8 copy used by the dashboard
  write_annotated_video: false  # burned-in overlay copy for reports
  start_timestamp: null         # ISO wall-clock time of frame 0, if known (e.g. "2026-10-20T08:00:00")
